name: build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release with this tag (e.g. v1.0.0). Leave empty to just build.'
        required: false
        default: ''
      replace:
        description: 'Delete an existing release and tag with the same name first'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Publish portable
        run: >
          msbuild WinMonitor.csproj /restore /t:Publish /m
          /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64
          /p:PublishDir=${{ github.workspace }}\publish\WinMonitor\

      - name: Check output
        shell: pwsh
        run: |
          $d = 'publish/WinMonitor'
          $files = Get-ChildItem $d -File | ForEach-Object Name
          "Publish output: $($files -join ', ')"
          if (-not (Test-Path "$d/WinMonitor.exe")) { throw 'WinMonitor.exe missing from the publish output' }
          if ($files.Count -ne 1) { throw "expected only WinMonitor.exe, found: $($files -join ', ')" }
          "{0:N1} MB" -f ((Get-ChildItem $d -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Launch tests and screenshots
        shell: powershell
        run: ./tests/smoke.ps1 -Dir publish/WinMonitor -Shots screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/*.png

      - name: Zip
        shell: pwsh
        # just WinMonitor.exe: settings.json is created next to it on first start
        run: Compress-Archive -Path publish/WinMonitor/WinMonitor.exe -DestinationPath WinMonitor-portable-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WinMonitor-portable-x64
          path: WinMonitor-portable-x64.zip

      - name: Replace existing release
        if: inputs.release != '' && inputs.replace
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ inputs.release }}" --cleanup-tag -y --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { Write-Host "No existing release" }
          git push origin ":refs/tags/${{ inputs.release }}" 2>$null
          exit 0

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: WinMonitor ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: WinMonitor-portable-x64.zip
